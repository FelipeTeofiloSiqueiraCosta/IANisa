<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f0f2e9">
  <meta name="description" content="IANiza · seu espaço de trabalho.">
  <title>Escritório · IANiza</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%23394731'/%3E%3Cpath d='M20 7v26M7 20h26M11 11l18 18M11 29l18-18' stroke='%23e1eeac' stroke-width='5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/workspace.css">
  <link rel="stylesheet" href="/brand.css">
  <link rel="stylesheet" href="/capabilities.css">
  <script src="/assets/app.js" defer></script>
</head>
<body class="workspace-page workspace-loading">
  <a class="workspace-skip" href="#office">Ir para o escritório</a>
  <header class="workspace-header">
    <a href="/" class="workspace-brand" aria-label="IANiza, escritório"><span>✳</span>ianiza<b>.</b></a>
    <div class="workspace-profile">
      <button id="profile-button" class="profile-button" aria-label="Abrir meu perfil" aria-controls="profile-panel" aria-expanded="false"><span id="profile-initials" aria-hidden="true"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 10 4 4 4-4"/></svg></button>
      <div class="profile-panel" id="profile-panel" hidden>
        <div class="profile-identity"><strong id="profile-name"></strong><span id="profile-email"></span></div>
        <button id="open-brain"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5a4 4 0 0 0-7-1 4 4 0 0 0-2 7 4 4 0 0 0 2 7 4 4 0 0 0 7 2m0-15a4 4 0 0 1 7-1 4 4 0 0 1 2 7 4 4 0 0 1-2 7 4 4 0 0 1-7 2V5Z"/></svg>Cérebro da empresa</button>
        <button id="open-ai" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 13 4-4m-6 7-1 1a4 4 0 0 1-6-6l4-4a4 4 0 0 1 6 0m2 0 1-1a4 4 0 0 1 6 6l-4 4a4 4 0 0 1-6 0"/></svg>Conexões de IA</button>
        <button id="open-skills"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M3 12h18M5.5 5.5l13 13m-13 0 13-13"/></svg>Skills</button>
        <button id="open-connectors"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 2v5m8-5v5M6 7h12v5a6 6 0 0 1-12 0V7Zm6 11v4"/></svg>Conectores</button>
        <a href="/conta"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Minha conta</a>
        <button id="sign-out"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H4v16h5m6-13 5 5-5 5M8 12h12"/></svg>Sair da conta</button>
        <p id="profile-error" role="alert" hidden></p>
      </div>
    </div>
  </header>
  <main class="workspace-stage">
    <div class="office-team" id="office-team" hidden><span class="office-team-kicker">SEU TIME</span><button id="open-lia" aria-label="Conhecer Lia, social media"><span class="office-team-avatar" aria-hidden="true">L</span><span><strong>Lia</strong><small>Social media</small></span><span class="office-team-dot" aria-hidden="true"></span><span class="office-team-arrow" aria-hidden="true">↗</span></button></div>
    <div id="office" class="workspace-office" tabindex="0" aria-label="Escritório de Marketing em 3D">
      <div id="office-loading" class="office-loading" role="status">Preparando seu escritório…</div>
    </div>
    <p id="office-hint" class="office-hint"><span class="desktop-hint">Arraste para girar · Role para aproximar</span><span class="touch-hint">Arraste para girar · Use dois dedos para aproximar</span></p>
    <div id="office-controls" class="office-controls" aria-label="Ajustar visualização do escritório">
      <button id="zoom-out" aria-label="Afastar" title="Afastar"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      <button id="zoom-in" aria-label="Aproximar" title="Aproximar"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <span></span>
      <button id="reset-view" aria-label="Voltar à visão inicial" title="Voltar à visão inicial"><svg viewBox="0 0 24 24"><path d="M3 11a9 9 0 1 1 3 7M3 4v7h7"/></svg></button>
    </div>
  </main>
  <div id="brain-root"></div>
  <div id="capabilities-root"></div>
  <div id="agents-root"></div>
</body>
</html>
